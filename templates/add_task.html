{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
<div class="col-md-7">

<div class="card">
    <div class="card-header bg-dark text-white">
        <i class="bi bi-plus-circle"></i> Add New Study Task
    </div>
    <div class="card-body p-4">
        <form method="POST">

            <div class="mb-3">
                <label class="form-label fw-semibold">Subject / Task Name</label>
                <input type="text" name="subject" class="form-control"
                    placeholder="e.g. Software Engineering, Calculus, Networks" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Deadline Date</label>
                <input type="date" name="deadline" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Difficulty Level
                    <span class="text-muted fw-normal">(1 = Easy, 5 = Very Hard)</span>
                </label>
                <select name="difficulty" class="form-select">
                    <option value="1">1 — Easy</option>
                    <option value="2">2 — Fairly Easy</option>
                    <option value="3" selected>3 — Medium</option>
                    <option value="4">4 — Hard</option>
                    <option value="5">5 — Very Hard</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Importance Level
                    <span class="text-muted fw-normal">(1 = Low, 5 = Critical)</span>
                </label>
                <select name="importance" class="form-select">
                    <option value="1">1 — Low</option>
                    <option value="2">2 — Moderate</option>
                    <option value="3" selected>3 — Important</option>
                    <option value="4">4 — Very Important</option>
                    <option value="5">5 — Critical</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">
                    Total Study Hours Needed
                    <span class="text-muted fw-normal">(How many hours to prepare for this?)</span>
                </label>
                <input type="number" name="study_hours" class="form-control"
                    min="1" max="50" step="0.5" value="5" required>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-plus-circle"></i> Add Task
                </button>
                <a href="/" class="btn btn-outline-secondary">Cancel</a>
            </div>

        </form>
    </div>
</div>

</div>
</div>

{% endblock %}
