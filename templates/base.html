<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Study Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(90deg, #1a1a2e, #16213e); }
        .navbar-brand { font-weight: 700; font-size: 1.3rem; color: #e94560 !important; }
        .nav-link { color: #ccc !important; }
        .nav-link:hover { color: #fff !important; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .card-header { border-radius: 12px 12px 0 0 !important; font-weight: 600; }
        .btn-primary { background: #e94560; border-color: #e94560; }
        .btn-primary:hover { background: #c73652; border-color: #c73652; }
        .priority-high { border-left: 4px solid #dc3545; }
        .priority-med  { border-left: 4px solid #ffc107; }
        .priority-low  { border-left: 4px solid #28a745; }
        .score-badge { font-size: 0.75rem; background: #1a1a2e; color: #e94560; padding: 2px 8px; border-radius: 20px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg mb-4">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-book-half"></i> Smart Study Planner</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/"><i class="bi bi-house"></i> Dashboard</a>
            <a class="nav-link" href="/add"><i class="bi bi-plus-circle"></i> Add Task</a>
            <a class="nav-link" href="/schedule"><i class="bi bi-calendar3"></i> Schedule</a>
            <a class="nav-link" href="/compare"><i class="bi bi-bar-chart"></i> Compare</a>
            <a class="nav-link" href="/progress"><i class="bi bi-check2-circle"></i> Progress</a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
